name: Rename the project from template

on: [push]
permissions: write-all
jobs:
  project-setup:
    if: ${{ !contains(github.repository,'/template-python-service') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          # by default, it uses a depth of 1
          # this fetches all history so that we can read each commit
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - run: echo "REPOSITORY_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}' | tr '-' '_' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        shell: bash

      - run: echo "REPOSITORY_OWNER=$(echo '${{ github.repository }}' | awk -F '/' '{print $1}')" >> $GITHUB_ENV
        shell: bash

      - name: Is this still a template
        id: is_template
        run: echo "::set-output name=is_template::$(ls .github/template.yml &> /dev/null && echo true || echo false)"

      - name: Rename the project
        if: steps.is_template.outputs.is_template == 'true'
        run: |
          echo "Renaming the project with  -t(template_project_name) ${{ env.REPOSITORY_NAME }}"
          .github/rename_project.sh -t ${{ env.REPOSITORY_NAME }}
          git config --global user.name '${{ env.REPOSITORY_OWNER }}'
          git config --global user.email '${{ env.REPOSITORY_OWNER }}@appomni.com'
          git commit -am "Project setup" -m "Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
          git branch main
          git push origin main
