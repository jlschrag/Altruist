apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: __TEMPLATE_PROJECT_NAME__-service
  namespace: __TEMPLATE_PROJECT_NAME__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: __TEMPLATE_PROJECT_NAME__-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
       type: Utilization
       averageUtilization: 75
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
  #    - type: Pods
  #      value: 1
  #      periodSeconds: 60
  #    selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 30
    #  - type: Pods
    #    value: 1
    #    periodSeconds: 15
    #  selectPolicy: Max
    
    